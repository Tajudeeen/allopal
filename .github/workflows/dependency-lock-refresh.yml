name: Refresh and verify dependency lock
on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/ci.yml
      - vitest.config.mts
      - tests/**
      - scripts/test.mjs
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: file:./ci.db
      PAYPAL_CLIENT_ID: ci-contract-client
      PAYPAL_CLIENT_SECRET: ci-contract-secret
      PAYPAL_API_BASE_URL: https://api-m.sandbox.paypal.com
      GROQ_API_KEY: ci-groq-contract-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/dependency-security-patches
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Pin npm CLI
        run: npm install --global npm@11.21.2
      - name: Regenerate lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Apply compatible transitive security fixes
        run: npm audit fix --audit-level=high
      - name: Clean install
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Deploy disposable database
        run: npm run db:deploy
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified lockfile
        if: success()
        run: |
          git restore next-env.d.ts
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: lock patched development dependencies"
            git push origin hardening/dependency-security-patches
          fi
