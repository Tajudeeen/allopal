name: Allopal Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:./ci.db
      PAYPAL_CLIENT_ID: ci-contract-client
      PAYPAL_CLIENT_SECRET: ci-contract-secret
      PAYPAL_API_BASE_URL: https://api-m.sandbox.paypal.com
      AI_API_KEY: ci-gemini-contract-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Deploy disposable database
        run: npm run db:deploy

      - name: Run tests
        run: npm test -- --run

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db
          NEXTAUTH_SECRET: ci-nextauth-secret

      - name: Upload build artifact
        if: success() && hashFiles('.next/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: .next
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: warn

  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t allopal:ci .

      - name: Run container
        run: |
          docker run -d --name allopal-ci \
            -e DATABASE_URL=file:/data/ci.db \
            -e NEXTAUTH_SECRET=ci-secret \
            -e PAYPAL_CLIENT_ID=ci \
            -e PAYPAL_CLIENT_SECRET=ci \
            -p 3000:3000 allopal:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          echo "health check failed"
          docker logs allopal-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs allopal-ci
      - name: Cleanup
        if: always()
        run: docker rm -f allopal-ci || true
