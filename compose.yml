services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: file:/data/allopal.db
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - allopal-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
  recovery:
    build: .
    command: ["npm", "run", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: file:/data/allopal.db
    volumes:
      - allopal-data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  allopal-data:
